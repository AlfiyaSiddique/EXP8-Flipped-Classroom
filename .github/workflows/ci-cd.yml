name: Build, publish and validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # The fallback keeps pull-request builds valid when fork secrets are unavailable.
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/clusterpilot-web

jobs:
  build-publish-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Kubernetes manifests
        uses: instrumenta/kubeval@master
        with:
          files: k8s
